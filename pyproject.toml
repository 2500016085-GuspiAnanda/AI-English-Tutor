[project]
name = "ai-english-tutor"
version = "0.1.0"
description = "Tutor percakapan bahasa Inggris berbasis agen AI untuk mahasiswa Indonesia"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.3",
    "google-genai>=3.3.0",
    "openai>=3.46.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
